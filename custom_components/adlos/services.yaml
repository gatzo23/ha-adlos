# Service definitions for Adlos Home Assistant Integration

send_message:
  name: Send message via Adlos
  description: Sends a notification text message, camera snapshot, or photo/image to the Adlos App.
  fields:
    message:
      name: Message / Text
      description: The main message text to send.
      required: true
      example: "Die Waschmaschine ist fertig!"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Haushalt"
      selector:
        text:
    target:
      name: Target / Recipient
      description: Optional recipient name (e.g. Kai) or group.
      required: false
      example: "Kai"
      selector:
        text:
    data:
      name: Extra Data
      description: Additional options such as camera entity or image URL.
      required: false
      example:
        camera: "camera.hauseingang"
        image: "https://example.com/snapshot.jpg"
      selector:
        object:

send_photo:
  name: Send photo via Adlos
  description: Sends a photo image file or camera snapshot with an optional message/caption to the Adlos App.
  fields:
    message:
      name: Caption / Text
      description: Optional text message or caption for the photo.
      required: false
      example: "Bewegung an der Auffahrt"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the photo.
      required: false
      example: "Kamera Auffahrt"
      selector:
        text:
    path:
      name: Image File Path / URL
      description: Local path or URL to the image file on Home Assistant.
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    target:
      name: Target / Recipient
      description: Optional recipient name (e.g. Kai) or group.
      required: false
      example: "Kai"
      selector:
        text:
    data:
      name: Extra Data
      description: Additional options such as camera entity.
      required: false
      example:
        camera: "camera.hauseingang"
      selector:
        object:
